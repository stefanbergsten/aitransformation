<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nodando Inference Curve</title><style>html,body{margin:0;min-height:100%;font-family:Arial,sans-serif}#loading{padding:40px;color:#10233f}</style></head><body><div id="loading">Loading Inference Curve…</div><script>(async()=>{try{const r=await fetch('./page.b64',{cache:'no-store'});if(!r.ok)throw new Error('Payload unavailable');const b64=(await r.text()).trim();const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const text=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();document.open();document.write(text);document.close();}catch(e){document.getElementById('loading').textContent='Unable to load the demo: '+e.message;}})();</script></body></html>
